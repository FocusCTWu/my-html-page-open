<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light">

  <title>精神支持服務地圖｜v4.9</title>

  <meta http-equiv="Content-Security-Policy"

  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.9.0/dist/maplibre-gl.css" crossorigin="anonymous"
    referrerpolicy="no-referrer">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.9.0/dist/maplibre-gl.css"
    crossorigin="anonymous" referrerpolicy="no-referrer">

  <script src="https://unpkg.com/maplibre-gl@5.9.0/dist/maplibre-gl.js" crossorigin="anonymous"
    referrerpolicy="no-referrer"></script>
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.9.0/dist/maplibre-gl.js" crossorigin="anonymous"
    referrerpolicy="no-referrer"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js" crossorigin="anonymous"
    referrerpolicy="no-referrer"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js" crossorigin="anonymous"
    referrerpolicy="no-referrer"></script>

  <style>
    :root {
      --ui-scale: 1;
      --ink: #13233a;
      --ink2: #314158;
      --muted: #68778b;
      --line: #dfe6ee;
      --panel: rgba(255, 255, 255, .94);
      --blue: #2367d1;
      --blue-50: #eef5ff;
      --blue-100: #d9e9ff;
      --purple: #7857c7;
      --purple-50: #f5f1ff;
      --purple-100: #e9e0ff;
      --green: #2b8a66;
      --green-50: #edf9f4;
      --green-100: #d8f2e6;
      --amber: #c98414;
      --amber-50: #fff8e8;
      --orange: #d97706;
      --shadow: 0 14px 44px rgba(31, 51, 77, .14);
      --shadow-soft: 0 7px 24px rgba(31, 51, 77, .10);
      --radius: 18px;
      --radius-sm: 12px;
    }

    * {
      box-sizing: border-box
    }

    html {
      font-size: calc(16px * var(--ui-scale))
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0
    }

    body {
      overflow: hidden;
      background: #dfe6ea;
      color: var(--ink);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button,
    select,
    input {
      font: inherit
    }

    button {
      cursor: pointer
    }

    .hidden {
      display: none !important
    }

    /* MAP */
    #map {
      position: fixed;
      inset: 0;
      z-index: 0
    }

    .leaflet-control-attribution {
      font-size: .66rem !important;
      background: rgba(255, 255, 255, .82) !important
    }

    .leaflet-control-zoom {
      border: 0 !important;
      box-shadow: var(--shadow-soft) !important;
      border-radius: 12px !important;
      overflow: hidden;
    }

    .leaflet-control-zoom a {
      border: 0 !important;
      color: var(--ink) !important;
      width: 36px !important;
      height: 36px !important;
      line-height: 36px !important
    }

    .leaflet-control-zoom a+a {
      border-top: 1px solid var(--line) !important
    }

    /* FLOATING TOP UI */
    .ui-stack {
      position: fixed;
      left: 18px;
      top: 18px;
      z-index: 1000;
      width: min(390px, calc(100vw - 36px));
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .brand-card,
    .control-card,
    .filter-panel {
      background: var(--panel);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(214, 224, 234, .9);
      box-shadow: var(--shadow);
      border-radius: var(--radius);
    }

    .brand-card {
      padding: 16px 16px 14px
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 11px
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: linear-gradient(145deg, #1e63d7, #3b7ae0);
      color: #fff;
      box-shadow: 0 7px 18px rgba(35, 103, 209, .25);
    }

    .brand-mark svg {
      width: 21px;
      height: 21px
    }

    .brand-title {
      min-width: 0;
      flex: 1
    }

    .brand-title h1 {
      font-size: 1rem;
      line-height: 1.25;
      margin: 0;
      font-weight: 850;
      letter-spacing: .01em
    }

    .brand-title .sub {
      margin-top: 2px;
      font-size: .69rem;
      color: var(--muted)
    }

    .font-controls {
      display: flex;
      gap: 4px
    }

    .font-controls button {
      width: 32px;
      height: 32px;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 9px;
      color: var(--ink2);
      font-size: .72rem;
      font-weight: 850;
      transition: .15s;
    }

    .font-controls button:hover:not(:disabled) {
      background: var(--blue-50);
      border-color: #aecbf4;
      color: var(--blue)
    }

    .font-controls button:disabled {
      opacity: .35;
      cursor: not-allowed
    }

    .control-card {
      padding: 10px
    }

    .profile-line {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 3px 4px 10px;
    }

    .profile-icon {
      width: 30px;
      height: 30px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: var(--blue-50);
      color: var(--blue);
      flex: 0 0 auto;
    }

    .profile-icon svg {
      width: 17px;
      height: 17px
    }

    .profile-copy {
      min-width: 0;
      flex: 1
    }

    .profile-copy small {
      display: block;
      font-size: .62rem;
      color: var(--muted);
      margin-bottom: 1px
    }

    #profileText {
      display: block;
      font-size: .78rem;
      line-height: 1.35;
      font-weight: 800;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .text-link {
      border: 0;
      background: transparent;
      color: var(--blue);
      font-size: .66rem;
      font-weight: 800;
      padding: 5px 4px;
    }

    .quick-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px
    }

    .quick-btn {
      min-height: 40px;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 11px;
      color: var(--ink2);
      font-size: .72rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: .15s;
    }

    .quick-btn svg {
      width: 15px;
      height: 15px
    }

    .quick-btn:hover,
    .quick-btn.active {
      border-color: #a8c7ef;
      background: var(--blue-50);
      color: var(--blue)
    }

    .result-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 7px;
      padding: 8px 5px 1px;
      border-top: 1px solid #edf1f5;
    }

    .result-count {
      display: flex;
      align-items: baseline;
      gap: 4px;
      color: var(--muted);
      font-size: .7rem
    }

    #resultCount {
      font-size: 1.12rem;
      color: var(--ink);
      font-weight: 900
    }

    .result-btn {
      border: 0;
      background: var(--ink);
      color: #fff;
      border-radius: 10px;
      min-height: 34px;
      padding: 0 12px;
      font-size: .69rem;
      font-weight: 850;
      box-shadow: 0 5px 14px rgba(19, 35, 58, .16);
      transition: .15s;
    }

    .result-btn:hover {
      transform: translateY(-1px);
      background: #203653
    }

    /* FILTER PANEL */
    .filter-panel {
      padding: 13px 13px 12px;
      max-height: min(61vh, 560px);
      overflow: auto;
      animation: panelIn .16s ease-out
    }

    @keyframes panelIn {
      from {
        opacity: 0;
        transform: translateY(-5px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px
    }

    .panel-head strong {
      font-size: .78rem
    }

    .close-mini {
      border: 0;
      background: #f3f6f9;
      color: var(--muted);
      border-radius: 999px;
      width: 28px;
      height: 28px;
      font-size: .85rem
    }

    .field-label {
      display: block;
      font-size: .65rem;
      color: var(--muted);
      margin: 0 0 5px
    }

    select {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: #fff;
      color: var(--ink);
      padding: 0 10px;
      font-size: .76rem;
      outline: none;
    }

    select:focus {
      border-color: #8bb7ec;
      box-shadow: 0 0 0 3px rgba(35, 103, 209, .08)
    }

    .service-list {
      display: flex;
      flex-direction: column;
      gap: 6px
    }

    .service-item {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 8px;
      align-items: start;
      padding: 9px 10px;
      border-radius: 12px;
      border: 1px solid transparent;
      transition: .12s;
    }

    .service-item.sfaa {
      background: var(--blue-50)
    }

    .service-item.domha {
      background: var(--purple-50)
    }

    .service-item.ltc {
      background: var(--green-50)
    }

    .service-item:hover {
      filter: brightness(.985);
      transform: translateY(-1px)
    }

    .service-item input {
      width: 17px;
      height: 17px;
      margin: 2px 0 0;
      accent-color: var(--blue)
    }

    .service-name {
      font-size: .73rem;
      line-height: 1.4;
      font-weight: 760;
      color: var(--ink)
    }

    .agency-chip {
      display: inline-flex;
      align-items: center;
      padding: 2px 6px;
      border-radius: 999px;
      font-size: .58rem;
      font-weight: 850;
      white-space: nowrap
    }

    .agency-chip.sfaa {
      background: var(--blue-100);
      color: #2159a7
    }

    .agency-chip.domha {
      background: var(--purple-100);
      color: #6847b1
    }

    .agency-chip.ltc {
      background: var(--green-100);
      color: #247458
    }

    .panel-foot {
      margin-top: 10px;
      padding-top: 9px;
      border-top: 1px solid #edf1f5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px
    }

    .mini-action {
      border: 0;
      background: transparent;
      color: var(--blue);
      font-size: .65rem;
      font-weight: 800;
      padding: 4px
    }

    .segmented {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px
    }

    .seg {
      position: relative
    }

    .seg input {
      position: absolute;
      opacity: 0
    }

    .seg span {
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .68rem;
      color: var(--ink2)
    }

    .seg input:checked+span {
      background: var(--blue-50);
      border-color: #9dc0ee;
      color: var(--blue);
      font-weight: 800
    }

    /* RESULT DRAWER */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(21, 31, 45, .16);
      z-index: 1100;
      opacity: 0;
      pointer-events: none;
      transition: .18s;
    }

    .drawer-backdrop.show {
      opacity: 1;
      pointer-events: auto
    }

    .result-drawer {
      position: fixed;
      right: 18px;
      top: 18px;
      bottom: 18px;
      width: min(410px, calc(100vw - 36px));
      z-index: 1200;
      display: flex;
      flex-direction: column;
      background: rgba(255, 255, 255, .97);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(214, 224, 234, .95);
      border-radius: 22px;
      box-shadow: 0 24px 70px rgba(31, 51, 77, .22);
      transform: translateX(calc(100% + 40px));
      transition: transform .22s cubic-bezier(.2, .8, .2, 1);
    }

    .result-drawer.open {
      transform: translateX(0)
    }

    .drawer-head {
      padding: 15px 16px 12px;
      border-bottom: 1px solid #edf1f5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px
    }

    .drawer-title strong {
      display: block;
      font-size: .9rem
    }

    .drawer-title small {
      font-size: .65rem;
      color: var(--muted)
    }

    .drawer-close {
      border: 0;
      background: #f2f5f8;
      width: 32px;
      height: 32px;
      border-radius: 999px;
      color: var(--muted)
    }

    #resultList {
      padding: 10px;
      overflow: auto;
      flex: 1
    }

    .resource-card {
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
      margin-bottom: 8px;
      transition: .14s;
      box-shadow: 0 2px 0 rgba(31, 51, 77, .02)
    }

    .resource-card:hover {
      border-color: #b8cce4;
      box-shadow: var(--shadow-soft);
      transform: translateY(-1px)
    }

    .resource-card.sfaa {
      border-left: 4px solid #5a91dc
    }

    .resource-card.domha {
      border-left: 4px solid #9479d0
    }

    .resource-card.ltc {
      border-left: 4px solid #61aa8d
    }

    .resource-name {
      font-size: .78rem;
      line-height: 1.4;
      font-weight: 850;
      color: var(--ink)
    }

    .resource-meta {
      font-size: .64rem;
      color: var(--muted);
      margin-top: 3px
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 7px
    }

    .service-pill {
      padding: 3px 6px;
      border-radius: 6px;
      font-size: .58rem;
      font-weight: 760;
      line-height: 1.3
    }

    .service-pill.sfaa {
      background: var(--blue-50);
      color: #315f9d
    }

    .service-pill.domha {
      background: var(--purple-50);
      color: #664ca3
    }

    .service-pill.ltc {
      background: var(--green-50);
      color: #2f755b
    }

    .card-actions {
      display: flex;
      gap: 6px;
      margin-top: 8px
    }

    .card-actions button {
      min-height: 32px;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 9px;
      color: var(--ink2);
      padding: 0 10px;
      font-size: .64rem;
      font-weight: 800
    }

    .card-actions button.primary {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink)
    }

    /* POPUP */
    .leaflet-popup-content-wrapper {
      border-radius: 18px !important;
      box-shadow: 0 16px 48px rgba(31, 51, 77, .22) !important;
      padding: 0 !important;
    }

    .leaflet-popup-content {
      margin: 0 !important;
      width: auto !important
    }

    .leaflet-popup-tip-container {
      filter: drop-shadow(0 3px 2px rgba(31, 51, 77, .08))
    }

    .leaflet-popup-close-button {
      width: 28px !important;
      height: 28px !important;
      line-height: 26px !important;
      right: 7px !important;
      top: 7px !important;
      border-radius: 999px;
      background: #f1f4f7 !important;
      color: #617084 !important;
      font-size: 18px !important;
      z-index: 4
    }

    .popup-card {
      min-width: 270px;
      max-width: 340px;
      padding: 15px
    }

    .popup-card h3 {
      font-size: .92rem;
      line-height: 1.35;
      margin: 0 34px 8px 0;
      color: var(--ink);
      font-weight: 880
    }

    .popup-top {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 8px
    }

    .type-badge,
    .fit-badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 7px;
      border-radius: 999px;
      font-size: .59rem;
      font-weight: 850
    }

    .type-service {
      background: var(--blue-50);
      color: #215ca9
    }

    .type-contact {
      background: var(--amber-50);
      color: #946310
    }

    .fit-badge {
      background: #f2f5f8;
      color: #516277
    }

    .address-box {
      padding: 8px 9px;
      border-radius: 10px;
      background: #f7f9fb;
      color: var(--ink2);
      font-size: .68rem;
      line-height: 1.45
    }

    .contact-warning {
      margin-top: 7px;
      padding: 7px 9px;
      border-radius: 10px;
      background: var(--amber-50);
      color: #8a5d16;
      font-size: .64rem;
      line-height: 1.45
    }

    .service-blocks {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-top: 9px
    }

    .service-block {
      padding: 9px 10px;
      border-radius: 11px;
      border: 1px solid var(--line);
      background: #fff
    }

    .service-block.sfaa {
      border-left: 4px solid #5a91dc
    }

    .service-block.domha {
      border-left: 4px solid #9479d0
    }

    .service-block.ltc {
      border-left: 4px solid #61aa8d
    }

    .service-block-head {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 6px
    }

    .service-block-head strong {
      font-size: .69rem;
      line-height: 1.4
    }

    .service-detail {
      font-size: .63rem;
      line-height: 1.5;
      color: var(--muted);
      margin-top: 5px
    }

    .service-detail a {
      color: var(--blue);
      font-weight: 800;
      text-decoration: none
    }

    .elig-details {
      margin-top: 8px;
      border-top: 1px solid #edf1f5
    }

    .elig-details summary {
      cursor: pointer;
      padding-top: 8px;
      font-size: .64rem;
      color: var(--blue);
      font-weight: 850
    }

    .elig-body {
      padding-top: 5px;
      font-size: .62rem;
      line-height: 1.5;
      color: var(--muted)
    }

    /* MARKERS & CLUSTERS */
    .leaflet-marker-icon.resource-click-target {
      display: flex !important;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: transparent !important;
      border: 0 !important
    }

    .leaflet-marker-icon.resource-click-target::before {
      content: "";
      position: absolute;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(35, 103, 209, 0);
      transition: .12s;
      pointer-events: none
    }

    .leaflet-marker-icon.resource-click-target:hover::before {
      background: rgba(35, 103, 209, .11);
      box-shadow: 0 0 0 1px rgba(35, 103, 209, .14)
    }

    .marker {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      position: relative;
      z-index: 2;
      box-shadow: 0 2px 7px rgba(19, 35, 58, .28)
    }

    .marker.service {
      background: #286ed8;
      border: 3px solid white
    }

    .marker.contact {
      background: white;
      border: 4px solid #e69216
    }

    .marker-cluster-small,
    .marker-cluster-medium,
    .marker-cluster-large {
      background: rgba(47, 107, 195, .16) !important
    }

    .marker-cluster div {
      background: #fff !important;
      color: var(--ink) !important;
      font-weight: 850 !important;
      border: 2px solid #91b6e4 !important;
      box-shadow: 0 4px 12px rgba(31, 51, 77, .14) !important
    }

    /* ONBOARDING */
    #onboarding {
      position: fixed;
      inset: 0;
      z-index: 3000;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(21, 31, 45, .38);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px)
    }

    .onboard {
      width: min(720px, 100%);
      background: #fff;
      border: 1px solid rgba(225, 232, 239, .95);
      border-radius: 24px;
      box-shadow: 0 28px 90px rgba(21, 31, 45, .28);
      padding: 24px
    }

    .step {
      font-size: .61rem;
      letter-spacing: .08em;
      font-weight: 900;
      color: var(--blue)
    }

    .onboard h2 {
      font-size: 1.25rem;
      margin: 4px 0 2px;
      letter-spacing: -.02em
    }

    function parseCSV(text, label) {
      if (typeof text !== "string" || text.length > window.APP_CONFIG.csv.maxFileSize * 2) {
        if (DEV_MODE) devBox.textContent = "[[DEV：CSV 內容大小異常]]";
        return;
      }

      Papa.parse(text, {
        header: true,
        skipEmptyLines: "greedy",
        transformHeader: h => String(h || "").replace(/^\uFEFF/, "").trim(),
        complete: r => {
          const fields = r.meta?.fields || [];
          const missing = window.APP_CONFIG.csv.expectedHeaders.filter(h => !fields.includes(h));
          if (missing.length) {
            if (DEV_MODE) devBox.textContent = `[[DEV：CSV 缺少必要欄位：${missing.join("、")}]]`;
            return;
          }
          if (r.errors?.length) {
            const fatal = r.errors.some(e => e.type === "Quotes" || e.type === "Delimiter");
            if (fatal) {
              if (DEV_MODE) devBox.textContent = "[[DEV：CSV 解析失敗]]";
              return;
            }
          }
          if (r.data.length > window.APP_CONFIG.csv.maxRows) {
            if (DEV_MODE) devBox.textContent = "[[DEV：CSV 筆數超過上限]]";
            return;
          }

          const normalized = r.data.map(normalizeRow).filter(Boolean);
          const expanded = normalized.flatMap(rec => rec.serviceNames.map(service => ({...rec, service})));
          serviceRecords = expanded;
          resources = groupResources(expanded);
          buildCounty();
          buildServices();
          render();
          csvFallback.classList.add("hidden");
          clearSystemNotice("data");
          if (DEV_MODE) devBox.textContent = `[[DEV：${expanded.length} 筆服務資料，${resources.length} 個資源點，來源 ${label}]]`;
        }
      });
    }

function exactCoordinateKey(item){
  return `${Number(item.lng).toFixed(7)}:${Number(item.lat).toFixed(7)}`;
}
function isExactSameLocationGroup(group){
  if(!group||group.length<2)return false;
  const key=exactCoordinateKey(group[0]);
  return group.every(item=>exactCoordinateKey(item)===key);
}

function makePointElement(item) {
      const el = document.createElement("button");
      el.type = "button";
      el.className = "dom-map-marker " + (item.addressType === "聯絡地址" ? "contact" : "service");
      el.setAttribute("aria-label", item.name);

      el.addEventListener("click", e => {
        e.preventDefault(); e.stopPropagation();
        openResourcePopup(item);
      });
      return el;
    }

    function makeClusterElement(group) {
      const el = document.createElement("button");
      el.type = "button";
      el.className = "dom-map-cluster";
      el.textContent = String(group.length);
      el.setAttribute("aria-label", `${group.length} 個資源`);
      el.addEventListener("click", e => {
        e.preventDefault(); e.stopPropagation();

        if (isExactSameLocationGroup(group)) {
          openSameLocationPopup(group);
          return;
        }

        const lngs = group.map(x => x.lng), lats = group.map(x => x.lat);
        if (group.length > 1) {
          map.fitBounds(
            [[Math.min(...lngs), Math.min(...lats)], [Math.max(...lngs), Math.max(...lats)]],
            {padding: 70, maxZoom: 15, duration: 450}
          );
        } else {
          map.easeTo({center: [group[0].lng, group[0].lat], zoom: 15, duration: 450});
        }
      });
      return el;
    }

    function getViewportRows(rows, padRatio = .12) {
      if (!mapReady || !map || !rows.length) return [];
      const b = map.getBounds(), sw = b.getSouthWest(), ne = b.getNorthEast();
      const lngPad = Math.max((ne.lng - sw.lng) * padRatio, .01);
      const latPad = Math.max((ne.lat - sw.lat) * padRatio, .01);
      return rows.filter(item =>
        item.lng >= sw.lng - lngPad && item.lng <= ne.lng + lngPad &&
        item.lat >= sw.lat - latPad && item.lat <= ne.lat + latPad
      );
    }

    function renderMapMarkers() {
      if (!mapReady || !map) return;
      clearMapMarkers();

      /* 只建立目前視窗附近的 DOM marker；平移/縮放結束後會重新計算。 */
      const rows = getViewportRows(currentFilteredRows, .12);
      if (!rows.length) return;

      const zoom = map.getZoom();
      const shouldCluster = zoom < 14;
      const cellSize = zoom < 9 ? 62 : zoom < 11 ? 56 : zoom < 13 ? 50 : 42;

      if (!shouldCluster) {
        const exactGroups = new Map();
        rows.forEach(item => {
          const key = exactCoordinateKey(item);
          if (!exactGroups.has(key)) exactGroups.set(key, []);
          exactGroups.get(key).push(item);
        });

        exactGroups.forEach(group => {
          if (group.length === 1) {
            const item = group[0];
            const marker = new maplibregl.Marker({element: makePointElement(item), anchor: "center"})
              .setLngLat([item.lng, item.lat]).addTo(map);
            mapMarkers.push(marker);
            return;
          }

          const marker = new maplibregl.Marker({element: makeClusterElement(group), anchor: "center"})
            .setLngLat([group[0].lng, group[0].lat]).addTo(map);
          mapMarkers.push(marker);
        });
        return;
      }

      const buckets = new Map();
      rows.forEach(item => {
        const p = map.project([item.lng, item.lat]);
        const key = `${Math.floor(p.x / cellSize)}:${Math.floor(p.y / cellSize)}`;
        if (!buckets.has(key)) buckets.set(key, []);
        buckets.get(key).push(item);
      });

      buckets.forEach(group => {
        if (group.length === 1) {
          const item = group[0];
          const marker = new maplibregl.Marker({element: makePointElement(item), anchor: "center"})
            .setLngLat([item.lng, item.lat]).addTo(map);
          mapMarkers.push(marker);
          return;
        }

        const lng = group.reduce((s, x) => s + x.lng, 0) / group.length;
        const lat = group.reduce((s, x) => s + x.lat, 0) / group.length;
        const marker = new maplibregl.Marker({element: makeClusterElement(group), anchor: "center"})
          .setLngLat([lng, lat]).addTo(map);
        mapMarkers.push(marker);
      });
    }

function openResourcePopup(item) {
      if (!mapReady) return;
      if (currentPopup) currentPopup.remove();

      /* 固定資訊卡永遠顯示在點位上方，避免 MapLibre 自動切換 anchor 造成卡片位置跳動。 */
      currentPopup = new maplibregl.Popup({
        maxWidth: "360px",
        anchor: "bottom",
        offset: [0, -12],
        closeButton: true,
        closeOnClick: false,
        focusAfterOpen: false
      })
        .setLngLat([item.lng, item.lat])
        .setDOMContent(popupContent(item))
        .addTo(map);

      /* 點位靠近畫面邊緣時，只平移地圖，不改變 popup 方向。 */
      window.requestAnimationFrame(() => keepPopupVisible(item));
    }

    function keepPopupVisible(item) {
      if (!mapReady || !currentPopup) return;
      const popupEl = currentPopup.getElement(), mapEl = map.getContainer();
      if (!popupEl || !mapEl) return;

      const pr = popupEl.getBoundingClientRect(), mr = mapEl.getBoundingClientRect();
      const ui = document.querySelector(".ui-stack");
      const ur = ui && !ui.classList.contains("hidden") ? ui.getBoundingClientRect() : null;
      const gap = 12;
      let dx = 0, dy = 0;

      if (pr.left < mr.left + 12) dx = pr.left - (mr.left + 12);
      else if (pr.right > mr.right - 18) dx = pr.right - (mr.right - 18);

      if (pr.top < mr.top + 12) dy = pr.top - (mr.top + 12);
      else if (pr.bottom > mr.bottom - 32) dy = pr.bottom - (mr.bottom - 32);

      if (ur) {
        const overlaps = !(pr.right < ur.left - gap || pr.left > ur.right + gap || pr.bottom < ur.top - gap || pr.top > ur.bottom + gap);
        if (overlaps) {
          /* 桌機優先將 popup 移到控制卡右側；手機控制卡橫跨畫面時則往下避開。 */
          if (window.innerWidth > 760) {
            dx = pr.left - (ur.right + gap);
          } else {
            dy = pr.top - (ur.bottom + gap);
          }
        }
      }

      if (dx || dy) map.panBy([dx, dy], {duration: 320});
    }

    function openResourceOnMap(item) {
      if (!mapReady) return;
      map.easeTo({center: [item.lng, item.lat], zoom: 15, duration: 500});

function fitSelectedCountyView(){
  if(!mapReady||!map)return;

  const county=countyFilter.value;
  const bounds=county==="all"?ALL_TAIWAN_VIEW_BOUNDS:COUNTY_VIEW_BOUNDS[county];

  if(bounds){
    map.fitBounds(bounds,{
      padding:countyFitPadding(),
      duration:500
    });
    return;
  }

  /* Fallback only if a future county name has no configured geographic bounds. */
  const rows=filteredResources();
  if(!rows.length)return;
  const lngs=rows.map(r=>r.lng),lats=rows.map(r=>r.lat);
  map.fitBounds(
    [[Math.min(...lngs),Math.min(...lats)],[Math.max(...lngs),Math.max(...lats)]],
    {padding:countyFitPadding(),maxZoom:12,duration:500}
  );
}

function groupedServiceDetails(item) {
      const map = new Map();
      relevantRecords(item).forEach(r => {
        if (!map.has(r.service)) map.set(r.service, {service: r.service, phones: [], areas: [], sources: []});
        const g = map.get(r.service);
        if (r.phone && !g.phones.includes(r.phone)) g.phones.push(r.phone);
        if (r.area && !g.areas.includes(r.area)) g.areas.push(r.area);
        if (r.source && !g.sources.includes(r.source)) g.sources.push(r.source);

    function extractDialableNumbers(raw) {
      let text = String(raw || "").trim();
      if (!text) return [];
      /* 將「兩個完整號碼只用空白分隔」轉成可解析分隔符。 */
      text = text.replace(/(\d)\s+(?=0\d)/g, "$1、");
      const parts = text.split(/[、｜，,；;\n]+/);
      const seen = new Set(), out = [];
      const rePhone = /(?:\(\s*)?0\d{1,3}(?:\s*\))?(?:[-\s]*\d){5,8}/;
      parts.forEach(part => {
        const m = part.match(rePhone);
        if (!m) return;
        const digits = m[0].replace(/\D/g, "");
        if (digits.length < 8 || digits.length > 10 || seen.has(digits)) return;
        seen.add(digits);
        out.push({display: m[0].trim(), href: `tel:${digits}`});
      });
      return out;
    }

      const panelIds = {county: "panelCounty", service: "panelService", more: "panelMore"};
      const already = !filterPanel.classList.contains("hidden") && !document.getElementById(panelIds[name]).classList.contains("hidden");
      document.querySelectorAll(".panel-view").forEach(x => x.classList.add("hidden"));
      document.querySelectorAll(".quick-btn").forEach(x => x.classList.remove("active"));
      if (already) {filterPanel.classList.add("hidden"); return;}
      document.getElementById(panelIds[name]).classList.remove("hidden");
      filterPanel.classList.remove("hidden");
      document.querySelector(`.quick-btn[data-panel="${name}"]`).classList.add("active");
    }
    function closePanel() {
      filterPanel.classList.add("hidden");
      document.querySelectorAll(".quick-btn").forEach(x => x.classList.remove("active"));
    }
    document.querySelectorAll(".quick-btn").forEach(b => b.addEventListener("click", () => openPanel(b.dataset.panel)));
    document.querySelectorAll("[data-close-panel]").forEach(b => b.addEventListener("click", closePanel));
    document.getElementById("clearServicesBtn").addEventListener("click", () => {
      document.querySelectorAll(".service-checkbox").forEach(x => x.checked = false); updateSelectedServiceCount(); render();
    });
    countyFilter.addEventListener("change",()=>{
  updateCountyQuickLabel();
  render();
  fitSelectedCountyView();
});
document.querySelectorAll('input[name="addressType"]').forEach(x => x.addEventListener("change", render));

    function openResults() {resultDrawer.classList.add("open"); drawerBackdrop.classList.add("show")}
    function closeResults() {resultDrawer.classList.remove("open"); drawerBackdrop.classList.remove("show")}
    document.getElementById("openResultsBtn").addEventListener("click", openResults);
    document.getElementById("closeResultsBtn").addEventListener("click", closeResults);
    drawerBackdrop.addEventListener("click", closeResults);

    /* five-level font scale */
    const FONT_LEVEL_SCALES = {1: 1, 2: 1.12, 3: 1.24, 4: 1.36, 5: 1.48};
    function applyFontLevel(level) {
      fontLevel = Math.max(1, Math.min(5, Number(level) || 1));
      document.documentElement.style.setProperty("--ui-scale", FONT_LEVEL_SCALES[fontLevel]);
      document.getElementById("fontDecrease").disabled = fontLevel <= 1;
      document.getElementById("fontIncrease").disabled = fontLevel >= 5;
      try {localStorage.setItem("communityMapFontLevel", String(fontLevel))} catch (e) { }
    }
    document.getElementById("fontDecrease").addEventListener("click", () => applyFontLevel(fontLevel - 1));
    document.getElementById("fontIncrease").addEventListener("click", () => applyFontLevel(fontLevel + 1));
    try {const n = Number(localStorage.getItem("communityMapFontLevel")); applyFontLevel(n >= 1 && n <= 5 ? n : 1)} catch (e) {applyFontLevel(1)}

    function subjectLabel(v){
  return v==="mental"?"精神病人／接受精神醫療":v==="disability"?"身心障礙者（有身障證明）":"";
}
function renderProfile(){
  if(profile.role==="self"){
    profileText.textContent=profile.subjectType?`我自己｜${subjectLabel(profile.subjectType)}`:"我自己";
  }else if(profile.role==="family"){
    const subject=subjectLabel(profile.subjectType);
    profileText.textContent=subject?`家人／照顧者｜${subject}`:"家人／照顧者";
  }else if(profile.role==="helper"){
    profileText.textContent="助人工作者｜完整資源";
  }else profileText.textContent="尚未選擇";
}
function showOnlyOnboardStep(id){
  ["roleStep","selfStep","familySubjectStep"].forEach(stepId=>
    document.getElementById(stepId).classList.toggle("hidden",stepId!==id)
  );
}
function showRoleStep(){showOnlyOnboardStep("roleStep")}
function finishProfile(){
  selectedResourceKeys.clear();
  updateSelectedUI();
  document.getElementById("onboarding").classList.add("hidden");
  renderProfile();
  if(resources.length){buildServices();render();}
}
document.querySelectorAll("[data-role]").forEach(b=>b.addEventListener("click",()=>{
  profile={role:b.dataset.role,subjectType:null,familyGoal:null};
  if(profile.role==="helper"){finishProfile();return}
  if(profile.role==="family")profile.familyGoal="both";
  showOnlyOnboardStep(profile.role==="self"?"selfStep":"familySubjectStep");
}));
document.querySelectorAll("[data-back]").forEach(b=>b.addEventListener("click",()=>{
  if(b.dataset.back==="family")showOnlyOnboardStep("familyStep");
  else showRoleStep();
}));
document.querySelectorAll("[data-subject]").forEach(b=>b.addEventListener("click",()=>{
  profile.subjectType=b.dataset.subject;finishProfile();
}));
document.querySelectorAll("[data-family-subject]").forEach(b=>b.addEventListener("click",()=>{
  profile.subjectType=b.dataset.familySubject;finishProfile();
}));
document.getElementById("changeProfileBtn").addEventListener("click",()=>{
  showRoleStep();document.getElementById("onboarding").classList.remove("hidden");
});

function bootstrapApp() {
      renderProfile();
      const missing = [];
      if (typeof maplibregl === "undefined") missing.push("MapLibre");
      if (typeof Papa === "undefined") missing.push("PapaParse");

      if (missing.length) {
        showSystemNotice("必要元件載入失敗（" + missing.join("、") + "）。請重新整理頁面；若仍無法使用，請改用 NLSC EMAP6 版。", "dependency", "error");
        return;
      }
      try {
        initMap();
        loadCSV();
      } catch (e) {
        showSystemNotice("地圖初始化失敗，請重新整理頁面或改用 NLSC EMAP6 版。", "dependency", "error");
        if (DEV_MODE) devBox.textContent = "[[DEV：" + String(e?.message || e).slice(0, 180) + "]]";
      }
    }
    bootstrapApp();
  </script>
</body>
